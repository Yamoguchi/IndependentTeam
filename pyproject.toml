[project]
name = "openjiuwen-challenge"
version = "0.1.0"
description = "Signed MCP team registration under the official JiuwenSwarm harness"
readme = "README.md"
authors = [
    { name = "Rodion Mustafaev", email = "rodion9116@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jiuwenswarm>=0.2.4b3.post1",
    "mcp>=1.30.0",
    "openjiuwen==0.1.16.post20",
    "portalocker>=4.4.2",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
openjiuwen-challenge = "openjiuwen_challenge.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
